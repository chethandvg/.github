# SPDX-License-Identifier: Apache-2.0
# Publish a GitHub release for a pushed v* tag. Zenodo (once switched on for
# the repo) archives each release and mints a DOI; Software Heritage is asked
# to archive the source.
name: release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every version field matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          status=0
          check() { [ -f "$1" ] || return 0; grep -Eq "$2" "$1" || { echo "::error file=$1::version is not $v"; status=1; }; }
          check CITATION.cff "^version: \"?$v\"?$"
          check CHANGELOG.md "^## \[$v\]"
          check Cargo.toml "^version = \"$v\""
          check pyproject.toml "^version = \"$v\""
          check package.json "\"version\": \"$v\""
          exit $status
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md section [$v] is empty"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
      - name: Ask Software Heritage to archive this version
        continue-on-error: true
        run: curl -fsS -X POST "https://archive.softwareheritage.org/api/1/origin/save/git/url/${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/"
