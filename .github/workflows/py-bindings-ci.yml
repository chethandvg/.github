# SPDX-License-Identifier: Apache-2.0
# Build the PyO3 bindings with maturin and run their golden-vector tests.
name: py-bindings-ci

on:
  workflow_call:
    inputs:
      path:
        description: Directory of the Python bindings (contains pyproject.toml).
        type: string
        default: bindings/python
      python-version:
        type: string
        default: "3.13"
      ek-spec:
        description: pip requirement for evidence-kernel, which provides the golden-vector runner.
        type: string
        default: "evidence-kernel @ git+https://github.com/chethandvg/evidence-kernel@v0.1.0"

permissions:
  contents: read

jobs:
  test:
    name: python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.path }}
      - run: python -m pip install --upgrade pip pytest "${{ inputs.ek-spec }}"
      - run: python -m pip install "./${{ inputs.path }}"
      - run: python -m pytest "${{ inputs.path }}/tests" -q
